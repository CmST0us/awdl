# TCP 自动调节发送内存：最小、初始、最大，单位字节。
# 保留 Linux 初始分配，仅将发送上限提高到 32 MiB，覆盖 NAN 时隙产生的带宽延迟积。
# 所有值为正整数且递增；移除配置后需恢复原值或重启，省略则由系统决定。
net.ipv4.tcp_wmem = 4096 16384 33554432
# TCP 自动调节接收内存，单位字节，同上；覆盖 5 GHz 全数据槽下的接收带宽延迟积。
net.ipv4.tcp_rmem = 4096 131072 33554432
# 新建网络接口的默认队列规则，无单位，必须有 sch_fq 内核模块。
# fq 按 TCP 提供的节奏发送，配合原生 NDI 保留至 TX 完成的 socket 记账。
# 不修改既有接口的队列；省略沿用系统默认，新接口创建时生效。
net.core.default_qdisc = fq
