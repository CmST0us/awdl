<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- root 可以取得服务名并调用管理接口；重新加载系统总线策略生效。 -->
  <policy user="root">
    <allow own="org.be200.WiFiAware1"/>
    <allow send_destination="org.be200.WiFiAware1"/>
  </policy>
  <!-- 普通用户可读取接口定义、属性与对象树。 -->
  <policy context="default">
    <allow send_destination="org.be200.WiFiAware1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.be200.WiFiAware1" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.be200.WiFiAware1" send_interface="org.freedesktop.DBus.ObjectManager"/>
  </policy>
</busconfig>
