<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- root 常驻进程取得应用总线名；重新加载系统总线策略生效。 -->
  <policy user="root"><allow own="org.airdrop1"/></policy>
  <!-- 本机合作者可以发送文件、确认接收、取消操作和读取进度。 -->
  <policy context="default"><allow send_destination="org.airdrop1"/></policy>
</busconfig>
