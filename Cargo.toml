[workspace]
members = ["components/common", "components/wifiawared", "components/fileserver", "tools/aware-build", "components/awdl", "components/airdrop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process", "io-util", "fs"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
libc = "0.2"
tempfile = "3"
aware-common = { path = "components/common" }

[profile.release]
strip = true
lto = "thin"
