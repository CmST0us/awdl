# Dragon Q8B / MT7925 安装示例；按实际部署地区填写。
# 硬件包标识，无单位，必须与实际网卡匹配；省略时安装器尝试检测。
hardware = "mt7925"
# 构建平台名，无单位，对应 platforms/dragon-q8b；省略时使用公共默认选择。
platform = "dragon-q8b"
# 目标机器完整 PCI 地址，无单位；空值或省略仅允许自动选出唯一受支持设备。
# 按实际机器修改；用于首次运行配置及设备规则，不是网卡固定地址。
pci = "0006:01:00.0"

[mt7925]
# 实际部署国家码，无单位，两个大写 ISO 3166-1 字母；必填，省略则拒绝驱动安装。
# CN 仅适用于位于中国的设备；--country 显式参数覆盖此值。
country = "CN"
